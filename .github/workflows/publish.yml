name: Publish Release
on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository (initial)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version=$(git describe --tags --abbrev=0)
          else
            version="${GITHUB_REF_NAME}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Checkout tag commit
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.version.outputs.version }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Validate changelog entry
        run: |
          version="${{ steps.version.outputs.version }}"
          if ! grep -q "## ${version}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md is missing an entry for ${version}"
            exit 1
          fi

      - name: Ensure pyproject version matches tag
        run: |
          version="${{ steps.version.outputs.version }}"
          file_version=$(python -c "import tomllib; from pathlib import Path; data = tomllib.loads(Path('pyproject.toml').read_text()); print(data['project']['version'])")
          if [ "$version" != "$file_version" ]; then
            echo "::error::pyproject version ($file_version) does not match tag ($version)"
            exit 1
          fi

      - name: Install build tooling
        run: uv sync --locked --extra build

      - name: Build distribution
        run: uv build

      - name: Validate distribution metadata
        run: uv run --locked --extra build twine check --strict dist/*

      - name: Generate release notes from changelog
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          awk -v ver="${version}" 'BEGIN{found=0}
            {
              if ($0 ~ "^## " ver) {found=1; next}
              if (found && /^## /) exit
              if (found) print
            }
            END {if (found == 0) exit 1}' CHANGELOG.md | sed '/^\s*$/d' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::No release notes found for ${version} in CHANGELOG.md" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: dist/*
          body_path: release_notes.md

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

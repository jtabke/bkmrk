name: Package validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install build tooling
        run: uv sync --locked --extra build
      - name: Build distributions
        run: uv build
      - name: Validate distribution metadata
        run: uv run --locked --extra build twine check --strict dist/*
      - name: Smoke-test installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          BOOKMARKS_DIR: ${{ runner.temp }}/bkmrk-smoke-store
        run: |
          uv venv bkmrk-smoke
          uv pip install --python bkmrk-smoke/bin/python "$GITHUB_WORKSPACE"/dist/*.whl
          bkmrk-smoke/bin/bm --help
          bkmrk-smoke/bin/bm init
          bkmrk-smoke/bin/bm add https://example.com --id smoke
          bkmrk-smoke/bin/bm show smoke

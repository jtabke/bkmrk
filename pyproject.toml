[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bkmrk"
version = "0.3.1"
description = "Plain-text, pass-style bookmarks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
keywords = ["bookmarks", "bm", "bkmrk", "Plain-text bookmarks"]
dependencies = []

[project.optional-dependencies]
completion = [
    "argcomplete>=3",
]
dev = [
    "argcomplete>=3",
    "commitizen",
    "mutmut",
    "prek",
    "pytest-cov",
    "pytest>=9.2",
    "ruff==0.17.4",
]
build = [
    "build",
    "commitizen",
    "twine",
]

[project.scripts]
bm = "bm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
exclude-newer = "3 days"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I"]
ignore = ["E501"]  # line too long, handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.3.1"
tag_format = "$version"
version_files = ["pyproject.toml:version"]
update_changelog_on_bump = true

[tool.mutmut]
source_paths = ["src/bm/"]
pytest_add_cli_args_test_selection = ["tests"]
pytest_add_cli_args = ["-x", "-q", "-k", "not test_module_entry_point_runs"]
do_not_mutate = ["src/bm/__init__.py", "src/bm/__main__.py"]
